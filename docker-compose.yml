version: '3.8'

services:
  app:
    build: .
    container_name: meezan-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://meezan_user:meezan_pass@postgres:5432/meezan_db?schema=public
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - postgres

  postgres:
    image: postgres:15-alpine
    container_name: meezan-postgres
    restart: always
    environment:
      POSTGRES_USER: meezan_user
      POSTGRES_PASSWORD: meezan_pass
      POSTGRES_DB: meezan_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
